<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Money Flow Tracker</title>
    <style>
      body { margin: 0; background: #07090e; }
      #app-loader {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100vh; color: #a0a0b0; font-family: system-ui, sans-serif;
      }
      #app-loader .spinner {
        width: 36px; height: 36px; border: 3px solid #1a1d2e;
        border-top-color: #00e676; border-radius: 50%;
        animation: spin 0.8s linear infinite; margin-bottom: 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #app-error {
        display: none; padding: 32px; color: #ff6b6b; font-family: monospace;
        font-size: 14px; max-width: 600px; margin: 60px auto;
        background: #1a1d2e; border-radius: 8px; border: 1px solid #ff6b6b33;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div class="spinner"></div>
        <div>Loading World Money Flow Tracker...</div>
      </div>
    </div>
    <div id="app-error"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('app-error');
        if (el) {
          el.style.display = 'block';
          el.innerHTML = '<h3 style="color:#ff6b6b;margin:0 0 12px">Application Error</h3>' +
            '<p>' + msg + '</p><p>Source: ' + (src||'') + ':' + (line||'') + '</p>' +
            '<p style="margin-top:12px;color:#888">Try refreshing with Ctrl+Shift+R</p>';
        }
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('app-error');
        if (el) {
          el.style.display = 'block';
          el.innerHTML = '<h3 style="color:#ff6b6b;margin:0 0 12px">Application Error</h3>' +
            '<p>' + (e.reason && e.reason.message || e.reason || 'Unknown error') + '</p>' +
            '<p style="margin-top:12px;color:#888">Try refreshing with Ctrl+Shift+R</p>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
